[project]
name = "local-snapshotter-context"
version = "0.1.0"
description = "Captures a context-local dict of key-value pairs and returns a serialized token string suitable for propagation across process boundaries."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
